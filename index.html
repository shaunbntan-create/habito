<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1" />
  <title>Habito — build the days you want</title>
  <meta name="description" content="Habito is a playful habit tracker and mood journal. Build streaks, see your week, check in with how you feel." />
  <meta name="theme-color" content="#fdfbf6" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="phone">
    <div class="stage">
      <!-- ===================== LOGIN ===================== -->
      <section id="login" class="screen">
        <div class="login-hero">
          <h1 class="wordmark">habito</h1>

          <!-- hand-drawn connector -->
          <svg class="squiggle" viewBox="0 0 200 70" fill="none">
            <path d="M6 48 C40 70 60 8 96 30 C120 44 140 6 150 26 C156 38 150 50 162 46"
                  stroke="#171717" stroke-width="2.4" stroke-linecap="round"/>
          </svg>

          <div class="faces">
            <!-- GREEN winking -->
            <div class="face f-green"><svg viewBox="0 0 100 100">
              <defs><radialGradient id="g_grn" cx="36%" cy="28%" r="80%"><stop offset="0" stop-color="#bdef98"/><stop offset="1" stop-color="#74cb4e"/></radialGradient></defs>
              <circle cx="50" cy="52" r="45" fill="url(#g_grn)"/>
              <path d="M28 45 q7 -8 14 -1" stroke="#171717" stroke-width="4.6" fill="none" stroke-linecap="round"/>
              <circle cx="65" cy="45" r="5.6" fill="#171717"/>
              <path d="M34 63 q16 13 31 1" stroke="#171717" stroke-width="4.6" fill="none" stroke-linecap="round"/>
            </svg></div>

            <!-- PINK closed-eye smile -->
            <div class="face f-pink"><svg viewBox="0 0 100 100">
              <defs><radialGradient id="g_pnk" cx="36%" cy="28%" r="80%"><stop offset="0" stop-color="#ffc0e3"/><stop offset="1" stop-color="#f072b4"/></radialGradient></defs>
              <circle cx="50" cy="52" r="45" fill="url(#g_pnk)"/>
              <rect x="34" y="40" width="4.6" height="13" rx="2.3" fill="#171717"/>
              <rect x="61" y="40" width="4.6" height="13" rx="2.3" fill="#171717"/>
              <path d="M40 64 q10 8 20 0" stroke="#171717" stroke-width="4.4" fill="none" stroke-linecap="round"/>
            </svg></div>

            <!-- CORAL big grin -->
            <div class="face f-coral"><svg viewBox="0 0 100 100">
              <defs><radialGradient id="g_crl" cx="36%" cy="28%" r="80%"><stop offset="0" stop-color="#ffac9f"/><stop offset="1" stop-color="#f4685a"/></radialGradient></defs>
              <circle cx="50" cy="52" r="45" fill="url(#g_crl)"/>
              <ellipse cx="37" cy="44" rx="5.4" ry="7" fill="#171717"/>
              <ellipse cx="63" cy="44" rx="5.4" ry="7" fill="#171717"/>
              <path d="M33 60 q17 18 34 0 q-17 6 -34 0 Z" fill="#171717"/>
            </svg></div>

            <!-- BLUE calm -->
            <div class="face f-blue"><svg viewBox="0 0 100 100">
              <defs><radialGradient id="g_blu" cx="36%" cy="28%" r="80%"><stop offset="0" stop-color="#aad4fb"/><stop offset="1" stop-color="#6aa9ee"/></radialGradient></defs>
              <circle cx="50" cy="52" r="45" fill="url(#g_blu)"/>
              <path d="M28 38 q8 -3 15 1" stroke="#171717" stroke-width="3.6" fill="none" stroke-linecap="round"/>
              <path d="M57 39 q8 -4 16 -1" stroke="#171717" stroke-width="3.6" fill="none" stroke-linecap="round"/>
              <circle cx="37" cy="49" r="5.6" fill="#171717"/>
              <circle cx="64" cy="49" r="5.6" fill="#171717"/>
              <path d="M40 66 q10 6 20 1" stroke="#171717" stroke-width="4.2" fill="none" stroke-linecap="round"/>
            </svg></div>

            <!-- YELLOW friendly -->
            <div class="face f-yellow"><svg viewBox="0 0 100 100">
              <defs><radialGradient id="g_ylw" cx="36%" cy="28%" r="80%"><stop offset="0" stop-color="#ffe08a"/><stop offset="1" stop-color="#f7bf3c"/></radialGradient></defs>
              <circle cx="50" cy="52" r="45" fill="url(#g_ylw)"/>
              <circle cx="37" cy="46" r="6" fill="#171717"/>
              <circle cx="65" cy="46" r="6" fill="#171717"/>
              <path d="M33 62 q17 15 34 1" stroke="#171717" stroke-width="4.6" fill="none" stroke-linecap="round"/>
            </svg></div>

            <!-- ORANGE small, glasses -->
            <div class="face f-orange"><svg viewBox="0 0 100 100">
              <defs><radialGradient id="g_org" cx="36%" cy="28%" r="80%"><stop offset="0" stop-color="#ffcaa6"/><stop offset="1" stop-color="#f79a63"/></radialGradient></defs>
              <circle cx="50" cy="52" r="45" fill="url(#g_org)"/>
              <circle cx="36" cy="48" r="12" fill="#fff" stroke="#171717" stroke-width="3.6"/>
              <circle cx="64" cy="48" r="12" fill="#fff" stroke="#171717" stroke-width="3.6"/>
              <line x1="48" y1="47" x2="52" y2="47" stroke="#171717" stroke-width="3.6"/>
              <circle cx="36" cy="48" r="4" fill="#171717"/>
              <circle cx="64" cy="48" r="4" fill="#171717"/>
              <path d="M44 70 q6 5 12 0" stroke="#171717" stroke-width="3.6" fill="none" stroke-linecap="round"/>
            </svg></div>
          </div>

          <div class="bubble">Hello~</div>
        </div>

        <div class="login-sheet">
          <p class="signin-label">Sign in to get started</p>

          <button class="btn btn-google" id="btnGoogle">
            <svg width="20" height="20" viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9 3.6l6.7-6.7C35.6 2.4 30.1 0 24 0 14.6 0 6.5 5.4 2.6 13.2l7.8 6.1C12.3 13.2 17.7 9.5 24 9.5z"/><path fill="#4285F4" d="M46.1 24.6c0-1.6-.1-3.1-.4-4.6H24v9.1h12.4c-.5 2.9-2.1 5.3-4.6 6.9l7.1 5.5c4.2-3.9 6.6-9.6 6.6-16.9z"/><path fill="#FBBC05" d="M10.4 28.3c-.5-1.5-.8-3.1-.8-4.8s.3-3.3.8-4.8l-7.8-6.1C.9 16 0 19.9 0 23.5s.9 7.5 2.6 10.9l7.8-6.1z"/><path fill="#34A853" d="M24 48c6.5 0 11.9-2.1 15.9-5.8l-7.1-5.5c-2 1.3-4.5 2.1-8.8 2.1-6.3 0-11.7-3.7-13.6-9.8l-7.8 6.1C6.5 42.6 14.6 48 24 48z"/></svg>
            Sign in with Google
          </button>

          <button class="btn btn-apple" id="btnApple">
            <svg width="18" height="20" viewBox="0 0 18 22" fill="currentColor"><path d="M14.7 11.6c0-2.6 2.1-3.8 2.2-3.9-1.2-1.8-3.1-2-3.8-2-1.6-.2-3.1.9-3.9.9-.8 0-2-.9-3.3-.9-1.7 0-3.3 1-4.2 2.5C-.2 11.2.9 16 2.6 18.6c.8 1.3 1.8 2.7 3.1 2.6 1.2-.1 1.7-.8 3.2-.8s1.9.8 3.3.8c1.4 0 2.2-1.3 3-2.6.9-1.5 1.3-2.9 1.3-3-.1 0-2.5-1-2.5-3.8zM12.2 3.9c.7-.8 1.1-2 1-3.2-1 0-2.2.7-2.9 1.5-.6.7-1.2 1.9-1 3 1.1.1 2.2-.5 2.9-1.3z"/></svg>
            Sign in with Apple
          </button>

          <div class="divider">or</div>

          <div class="email-row">
            <input type="email" id="emailInput" placeholder="you@email.com" autocomplete="email" inputmode="email" />
            <button class="email-send" id="btnEmail" aria-label="Continue with email">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M5 12h14M13 6l6 6-6 6" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </button>
          </div>
          <p class="email-note" id="emailNote"></p>

          <button class="demo-link" id="btnDemo">explore the demo &rarr;</button>
        </div>
      </section>

      <!-- ===================== APP ===================== -->
      <main id="app" class="screen" hidden>
        <div class="app-screens">
          <section class="app-screen" id="sc-habits"></section>
          <section class="app-screen" id="sc-mood" hidden></section>
          <section class="app-screen" id="sc-time" hidden></section>
          <section class="app-screen" id="sc-profile" hidden></section>
        </div>

        <nav class="tabbar">
          <button class="tab active" data-tab="habits" aria-label="Habits">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none"><rect x="3" y="11" width="4" height="9" rx="1.4" fill="currentColor"/><rect x="10" y="5" width="4" height="15" rx="1.4" fill="currentColor"/><rect x="17" y="8" width="4" height="12" rx="1.4" fill="currentColor"/></svg>
          </button>
          <button class="tab" data-tab="mood" aria-label="Mood">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="2"/><circle cx="9" cy="10" r="1.3" fill="currentColor"/><circle cx="15" cy="10" r="1.3" fill="currentColor"/><path d="M8.5 14.5q3.5 3 7 0" stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none"/></svg>
          </button>
          <button class="fab" id="fab" aria-label="Add habit">
            <svg width="26" height="26" viewBox="0 0 24 24" fill="none"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/></svg>
          </button>
          <button class="tab" data-tab="time" aria-label="Time audit">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="2"/><path d="M12 7v5l3.5 2" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
          <button class="tab" data-tab="profile" aria-label="Profile">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="8.5" r="4" stroke="currentColor" stroke-width="2"/><path d="M5 20c0-3.6 3.1-6 7-6s7 2.4 7 6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
          </button>
        </nav>

        <!-- add habit modal -->
        <div class="modal" id="addHabitModal" hidden>
          <div class="modal-scrim" data-close></div>
          <div class="sheet">
            <h3>New habit</h3>
            <div class="field">
              <label for="nhName">What do you want to build?</label>
              <input id="nhName" type="text" placeholder="e.g. Read 20 pages" maxlength="40" />
            </div>
            <div class="field">
              <label>Icon</label>
              <div class="emoji-row" id="nhEmoji">
                <button class="emoji-pick sel" type="button">📖</button>
                <button class="emoji-pick" type="button">✍️</button>
                <button class="emoji-pick" type="button">📚</button>
                <button class="emoji-pick" type="button">🧠</button>
                <button class="emoji-pick" type="button">🗣️</button>
                <button class="emoji-pick" type="button">🏃</button>
                <button class="emoji-pick" type="button">🏋️</button>
                <button class="emoji-pick" type="button">🚴</button>
                <button class="emoji-pick" type="button">🚶</button>
                <button class="emoji-pick" type="button">🧘</button>
                <button class="emoji-pick" type="button">💧</button>
                <button class="emoji-pick" type="button">🥗</button>
                <button class="emoji-pick" type="button">🍎</button>
                <button class="emoji-pick" type="button">☕</button>
                <button class="emoji-pick" type="button">💊</button>
                <button class="emoji-pick" type="button">😴</button>
                <button class="emoji-pick" type="button">🌙</button>
                <button class="emoji-pick" type="button">💻</button>
                <button class="emoji-pick" type="button">⏰</button>
                <button class="emoji-pick" type="button">🎨</button>
                <button class="emoji-pick" type="button">🎸</button>
                <button class="emoji-pick" type="button">💰</button>
                <button class="emoji-pick" type="button">🙏</button>
                <button class="emoji-pick" type="button">🌱</button>
              </div>
            </div>
            <div class="field">
              <label>Color</label>
              <div class="swatch-row" id="nhColor"></div>
            </div>
            <div class="field">
              <label>How often?</label>
              <div class="chip-row" id="nhFreq">
                <button class="chip sel" type="button">Everyday</button>
                <button class="chip" type="button">5 days per week</button>
                <button class="chip" type="button">Weekends</button>
              </div>
            </div>
            <div class="sheet-actions">
              <button class="btn-ghost" type="button" data-close>Cancel</button>
              <button class="btn-solid" type="button" id="nhSave">Add habit</button>
            </div>
          </div>
        </div>

        <!-- onboarding tutorial -->
        <div class="tut" id="tutorial" hidden></div>
      </main>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script src="store.js"></script>
  <script src="auth.js"></script>
  <script src="screens.js"></script>
  <script src="app.js"></script>
</body>
</html>
